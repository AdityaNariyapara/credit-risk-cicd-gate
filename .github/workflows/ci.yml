name: CI Quality Gate

# Runs on every pull request into main, and on pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull DVC-tracked data (from the in-repo local remote)
        run: dvc pull

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Data gate (validate dataset before training)
        run: python scripts/validate_data.py --config configs/ci.yaml

      - name: Train + evaluate quality gate (CI config)
        run: python scripts/run_gate.py --config configs/ci.yaml --summary gate_summary.md

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary
          path: |
            gate_summary.md
            gate_result.json
